# Alembic configuration. The database URL is NOT set here: migrations/env.py
# reads it from app settings (backend/.env), so there is a single source of truth.
#
#   .venv/bin/alembic upgrade head                       # apply migrations
#   .venv/bin/alembic revision --autogenerate -m "msg"   # new migration from model changes
#
# The app also runs "upgrade head" automatically on startup (app/database/init_db.py).

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
